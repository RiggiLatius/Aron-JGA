<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c11">
<title>Aron JGA – Bar Crawl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&display=swap">
<style>
/* ═══ Tokens ═══ */
:root{
  color-scheme:dark;
  --bg:#0b0c11; --bg-2:#0f1118;
  --surf:#151822; --surf-2:#1d2130; --surf-3:#272c3c;
  --line:#262b38; --line-2:#333a4c;
  --tx:#f4f6fa; --tx-2:#a9b2c2; --tx-3:#727c8e;
  --ac:#ff8a2b; --ac-h:#ffa45c; --ac-dim:rgba(255,138,43,.13); --ac-line:rgba(255,138,43,.42); --on-ac:#200d00;
  --ok:#35d6a0; --ok-dim:rgba(53,214,160,.12); --ok-line:rgba(53,214,160,.38);
  --bad:#ff5c7a; --bad-dim:rgba(255,92,122,.12); --bad-line:rgba(255,92,122,.38);
  --gold:#ffc93c; --silver:#c6d0e2; --bronze:#d9884e;
  --r-s:10px; --r-m:14px; --r-l:20px; --r-xl:28px;
  --sh-1:0 1px 2px rgba(0,0,0,.45), 0 3px 10px rgba(0,0,0,.28);
  --sh-2:0 6px 14px rgba(0,0,0,.45), 0 20px 40px rgba(0,0,0,.35);
  --ff:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --fd:"Bricolage Grotesque","Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:var(--ff); font-size:16px; line-height:1.45; font-weight:450;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1,"cv05" 1;
  padding:0 0 calc(80px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%; overflow-x:hidden;
  background-image:radial-gradient(120% 55% at 50% 0,rgba(255,138,43,.07),transparent 70%);
  background-attachment:fixed;
}
h1,h2,h3{margin:0;font-family:var(--fd);font-weight:800;letter-spacing:-.025em;line-height:1.1;text-wrap:balance}
h2{font-size:22px} h3{font-size:16px;letter-spacing:-.015em}
a{color:var(--ac-h);text-underline-offset:3px;text-decoration-thickness:1px}
/* ═══ Browser-Oberflächen ═══ */
::selection{background:var(--ac);color:var(--on-ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
input,textarea{caret-color:var(--ac)}
*{scrollbar-width:thin;scrollbar-color:var(--surf-3) transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--surf-3);border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
/* ═══ Icons ═══ */
.ic{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic.lg{width:24px;height:24px}
.ic.sm{width:16px;height:16px;stroke-width:2}
/* ═══ Header ═══ */
header{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:11px;
  padding:calc(11px + env(safe-area-inset-top)) 16px 11px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid var(--line);
}
header .thumb{display:block;width:36px;height:36px;border-radius:50%;object-fit:cover;flex:0 0 auto;
  background:var(--surf-2);border:1.5px solid var(--ac)}
#hdrimg:empty{display:none}
header h1{font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;
  padding:6px 10px;border-radius:999px;background:var(--surf-2);color:var(--tx-2);border:1px solid var(--line)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.live{color:var(--ok);border-color:var(--ok-line);background:var(--ok-dim)}
.pill.live::before{animation:pulse 2.4s var(--ease) infinite}
.pill.local{color:var(--gold);border-color:rgba(255,201,60,.34);background:rgba(255,201,60,.1)}
.pill.bad{color:var(--bad);border-color:var(--bad-line);background:var(--bad-dim)}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.8)}45%{opacity:1;transform:scale(1.15)}}
/* ═══ Layout ═══ */
main{padding:16px 16px 28px;max-width:660px;margin:0 auto}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;margin:0 0 12px;box-shadow:var(--sh-1)}
.card.tight{padding:12px 14px;border-radius:var(--r-m)}
.card.flat{background:transparent;border-color:var(--line);box-shadow:none}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mu{color:var(--tx-2)}
.sm{font-size:13.5px} .xs{font-size:12px}
.b{font-weight:650}
.center{text-align:center}
.sep{height:1px;background:var(--line);margin:14px -16px}
.hint{font-size:13px;color:var(--tx-2);line-height:1.45;max-width:62ch}
.spacer{height:10px}
.eyebrow{display:flex;align-items:center;gap:8px;margin:0 0 10px;color:var(--tx-2);font-size:12px;font-weight:650;letter-spacing:.09em;text-transform:uppercase}
.eyebrow .ic{width:15px;height:15px;stroke-width:2}
/* ═══ Hero ═══ */
.hero{position:relative;border-radius:var(--r-xl);overflow:hidden;margin:0 0 14px;background:var(--surf);box-shadow:var(--sh-2)}
.hero img{display:block;width:100%;max-width:100%;height:auto;max-height:50vh;object-fit:cover;object-position:center 22%}
.hero.noimg{height:132px;display:grid;place-items:center;background:
  radial-gradient(120% 120% at 20% 0,rgba(255,138,43,.35),transparent 60%),var(--surf-2)}
.hero.noimg .ic{width:46px;height:46px;color:var(--ac);stroke-width:1.4}
.hero .cap{position:absolute;inset:auto 0 0 0;padding:52px 18px 16px;
  background:linear-gradient(transparent,rgba(0,0,0,.55) 42%,rgba(0,0,0,.93))}
.hero .cap .t{font-family:var(--fd);font-size:clamp(26px,7vw,34px);font-weight:800;letter-spacing:-.035em;line-height:1}
.hero .cap .s{margin-top:5px;font-size:13.5px;color:#d9dfea;font-weight:500}
/* ═══ Buttons ═══ */
button{font:inherit;color:inherit;font-family:var(--ff)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:46px;padding:0 16px;border-radius:var(--r-m);border:1px solid var(--line-2);
  background:var(--surf-2);color:var(--tx);font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap;
  transition:background .16s var(--ease),border-color .16s var(--ease),transform .12s var(--ease),box-shadow .16s var(--ease);
}
@media(hover:hover){.btn:hover{background:var(--surf-3);border-color:var(--line-2)}}
.btn:active{transform:scale(.975)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--on-ac);font-weight:700;box-shadow:0 2px 4px rgba(0,0,0,.45),0 10px 22px rgba(0,0,0,.3)}
@media(hover:hover){.btn.pri:hover{background:var(--ac-h);border-color:var(--ac-h)}}
.btn.ok{background:var(--ok-dim);border-color:var(--ok-line);color:var(--ok)}
.btn.bad{background:var(--bad-dim);border-color:var(--bad-line);color:var(--bad)}
.btn.gho{background:transparent;border-color:var(--line)}
.btn.big{min-height:56px;font-size:17px;width:100%;border-radius:var(--r-l)}
.btn.sq{min-width:46px;padding:0 11px}
.btn.mini{min-height:34px;font-size:13px;padding:0 11px;border-radius:var(--r-s);gap:5px}
.btn.mini .ic{width:15px;height:15px;stroke-width:2}
.btn[disabled]{opacity:.4;pointer-events:none}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}
.btnrow>.btn{flex:1}
/* ═══ Eingaben ═══ */
input[type=text],input[type=number],input[type=password],select,textarea{
  font:inherit;font-family:var(--ff);width:100%;min-height:46px;padding:10px 12px;border-radius:var(--r-m);
  background:var(--bg-2);border:1px solid var(--line);color:var(--tx);
  transition:border-color .16s var(--ease),background .16s var(--ease);
}
input::placeholder,textarea::placeholder{color:var(--tx-3)}
input:focus,select:focus,textarea:focus{border-color:var(--ac);background:var(--surf);outline:2px solid var(--ac);outline-offset:1px}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a9b2c2' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;background-size:17px;padding-right:38px}
textarea{min-height:170px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.5}
label.chk{display:inline-flex;align-items:center;gap:9px;min-height:44px;font-size:14px;cursor:pointer}
label.chk input{width:22px;height:22px;min-height:0;accent-color:var(--ac)}
.field{margin:0 0 12px}
.field>span{display:block;font-size:12px;color:var(--tx-2);margin:0 0 6px;font-weight:650;letter-spacing:.04em}
/* ═══ Rangliste ═══ */
.leader{position:relative;border-radius:var(--r-xl);padding:20px;margin:0 0 12px;overflow:hidden;
  background:linear-gradient(150deg,rgba(255,201,60,.16),rgba(255,138,43,.05) 55%,transparent),var(--surf);
  border:1px solid rgba(255,201,60,.3);box-shadow:var(--sh-2)}
.leader .crown{display:flex;align-items:center;gap:7px;color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.leader .nm{font-family:var(--fd);font-size:clamp(28px,8vw,38px);font-weight:800;letter-spacing:-.035em;margin:6px 0 2px;line-height:1}
.leader .sub{color:var(--tx-2);font-size:13.5px}
.leader .num{font-family:var(--fd);font-size:clamp(46px,14vw,62px);font-weight:800;line-height:.85;letter-spacing:-.05em;color:var(--gold)}
.leader .num small{display:block;font-family:var(--ff);font-size:11.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--tx-2);margin-top:7px}
.rank{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:var(--r-m);background:var(--surf);
  border:1px solid var(--line);margin:0 0 8px;position:relative;overflow:hidden}
.rank .meter{position:absolute;left:0;bottom:0;height:2.5px;border-radius:0 3px 3px 0;background:var(--ac);opacity:.55;pointer-events:none}
.rank>*{position:relative}
.rank .pos{width:30px;height:30px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;font-size:14px;
  font-weight:700;background:var(--surf-2);color:var(--tx-2);border:1px solid var(--line)}
.rank.p2 .pos{background:var(--silver);color:#1b1f27;border-color:transparent}
.rank.p3 .pos{background:var(--bronze);color:#2a1405;border-color:transparent}
.rank .nm{font-size:16.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.rank .big{font-family:var(--fd);font-size:27px;font-weight:800;line-height:1;letter-spacing:-.03em;text-align:right}
.rank .big small{display:block;font-family:var(--ff);font-size:10.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-3);margin-top:4px}
/* ═══ Tour ═══ */
.tour{position:relative;padding-left:30px}
.tour::before{content:"";position:absolute;left:9px;top:12px;bottom:14px;width:2px;border-radius:2px;
  background:linear-gradient(var(--line-2),var(--line-2) 60%,transparent)}
.loc{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r-l);padding:15px;margin:0 0 11px;cursor:pointer;position:relative;
  transition:border-color .18s var(--ease),transform .14s var(--ease),background .18s var(--ease)}
.loc::before{content:"";position:absolute;left:-26px;top:20px;width:12px;height:12px;border-radius:50%;
  background:var(--bg);border:2px solid var(--line-2);box-shadow:0 0 0 4px var(--bg)}
.loc.active::before{background:var(--ac);border-color:var(--ac);box-shadow:0 0 0 4px var(--bg)}
.loc.done::before{background:var(--ok);border-color:var(--ok)}
@media(hover:hover){.loc:hover{border-color:var(--line-2)}}
.loc:active{transform:scale(.99)}
.loc.active{border-color:var(--ac-line);background:linear-gradient(180deg,var(--ac-dim),transparent 60%),var(--surf)}
.loc.done{background:var(--bg-2)}
.loc .n{font-size:17px;font-weight:700;letter-spacing:-.015em}
.loc .drink{display:flex;align-items:center;gap:9px;font-family:var(--fd);font-size:25px;font-weight:800;letter-spacing:-.03em;
  color:var(--ac-h);line-height:1.1;margin:11px 0 2px}
.loc .drink .ic{width:22px;height:22px;color:var(--ac);stroke-width:1.6}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  padding:5px 9px;border-radius:999px;background:var(--surf-2);color:var(--tx-2);border:1px solid var(--line);white-space:nowrap}
.badge.a{color:var(--ac);border-color:var(--ac-line);background:var(--ac-dim)}
.badge.d{color:var(--ok);border-color:var(--ok-line);background:var(--ok-dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 10px;border-radius:999px;
  background:var(--surf-2);border:1px solid var(--line);color:var(--tx-2)}
.chip b{color:var(--tx);font-weight:700}
.chip.win{border-color:rgba(255,201,60,.4);background:rgba(255,201,60,.1);color:var(--gold)}
.chip.win b{color:var(--gold)}
/* ═══ Rad ═══ */
.wheelwrap{display:grid;place-items:center;position:relative;margin:6px 0 14px;padding:10px 0}
canvas#wheel{max-width:100%;height:auto;touch-action:manipulation;
  filter:drop-shadow(0 16px 36px rgba(0,0,0,.6))}
.needle{position:absolute;top:2px;left:50%;transform:translateX(-50%);z-index:2;color:var(--ac);
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.6))}
.result{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--fd);font-size:clamp(24px,6.5vw,30px);
  font-weight:800;letter-spacing:-.03em;text-align:center;line-height:1.15;color:var(--ac-h);margin:4px 0 12px;min-height:1.3em}
.result .ic{width:26px;height:26px;color:var(--ac);stroke-width:1.6}
/* ═══ Admin ═══ */
details.sec{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-l);margin:0 0 10px;overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;padding:16px;font-weight:650;font-size:15.5px;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .ic{color:var(--tx-2)}
details.sec[open]>summary{border-bottom:1px solid var(--line)}
details.sec[open]>summary .ic.chev{transform:rotate(180deg)}
.chev{margin-left:auto;color:var(--tx-3);transition:transform .2s var(--ease)}
details.sec>summary .cnt{font-size:12px;color:var(--tx-3);font-weight:600;letter-spacing:0}
.secbody{padding:14px 16px 16px}
.item{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-m);padding:11px;margin:0 0 9px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper input{width:76px;text-align:center;font-family:var(--fd);font-size:21px;font-weight:800;min-height:46px}
.logline{padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.logline:last-child{border-bottom:0}
.logline .t{color:var(--tx-3)}
.logline .v{font-weight:650}
.logline .from{color:var(--bad)} .logline .to{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--tx);color:#101219;font-weight:650;font-size:14px;padding:12px 18px;border-radius:999px;z-index:60;
  box-shadow:var(--sh-2);max-width:92vw;text-align:center;animation:toastin .32s var(--ease)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px) scale(.96)}}
.warn{background:var(--bad-dim);border:1px solid var(--bad-line);color:#ffc7d1;border-radius:var(--r-m);padding:13px;font-size:13.5px}
.note{display:flex;gap:10px;background:var(--ac-dim);border:1px solid var(--ac-line);color:#ffdcc0;border-radius:var(--r-m);padding:13px;font-size:13.5px}
.note .ic{color:var(--ac);margin-top:1px}
.note b{color:var(--tx)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* ═══ Tableiste ═══ */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:color-mix(in srgb,var(--bg-2) 88%,transparent);backdrop-filter:blur(18px) saturate(140%);
  border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;background:none;border:0;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:5px;
  color:var(--tx-3);font-size:11px;font-weight:650;cursor:pointer;min-height:64px;justify-content:center;
  transition:color .18s var(--ease);position:relative;
}
nav.tabs button .ic{width:23px;height:23px;transition:transform .24s var(--ease)}
nav.tabs button.on{color:var(--ac)}
nav.tabs button.on .ic{transform:translateY(-1px)}
nav.tabs button.on::after{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:2.5px;
  border-radius:0 0 3px 3px;background:var(--ac)}
/* ═══ Bewegung ═══ */
.enter>*{animation:rise .5s var(--ease) both}
.enter>*:nth-child(1){animation-delay:.01s} .enter>*:nth-child(2){animation-delay:.05s}
.enter>*:nth-child(3){animation-delay:.09s} .enter>*:nth-child(4){animation-delay:.13s}
.enter>*:nth-child(5){animation-delay:.17s} .enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.985);filter:blur(3px)}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>

<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21.2C12 21.2 19 15.6 19 10a7 7 0 1 0-14 0c0 5.6 7 11.2 7 11.2Z"/><circle cx="12" cy="10" r="2.6"/></symbol>

<script type="module">
/* ══════════════════════════════════════════════════════════════════════
   ██  FIREBASE-CONFIG  –  HIER EINTRAGEN (Firebase Console → Projekt-  ██
   ██  einstellungen → "Meine Apps" → Web-App → SDK-Konfiguration)      ██
   ══════════════════════════════════════════════════════════════════════
   Wichtig ist vor allem "databaseURL". Solange dort "HIER_" steht,
   läuft die App im Demo-Modus (Daten nur auf diesem Gerät).            */
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyCEjXjy_bJahEaTU8xaRiZ5RT70FA1tD00",
  authDomain:        "aron-jga.firebaseapp.com",
  databaseURL:       "",   // darf leer bleiben – siehe DB_REGIONS unten
  projectId:         "aron-jga",
  storageBucket:     "aron-jga.firebasestorage.app",
  messagingSenderId: "800681281414",
  appId:             "1:800681281414:web:3f513d9f27572e17aece07"
};
/* Die Adresse der Realtime Database steht nur dann im Firebase-Snippet, wenn die
   Datenbank schon existiert. Ist "databaseURL" oben leer, probiert die App diese
   Regionen der Reihe nach durch und merkt sich die, die antwortet. Die Region
   beim Anlegen der Datenbank ist damit egal.                                  */
const DB_REGIONS = ['europe-west1','us-central1','asia-southeast1'];
/* Admin-Passwort. Gilt nur fuer eine frische Datenbank – sobald die App einmal
   gestartet ist, lebt das Passwort in settings.password und wird ausschliesslich
   im Admin-Tab geaendert.                                                     */
const DEFAULT_PW = "$$$";
const ROOT     = "aron-jga";   // DB-Pfade: /aron-jga/data  und  /aron-jga/log
const LOG_MAX  = 500;          // älteste Log-Einträge rollen raus
/* ════════════════════ ENDE CONFIG – ab hier nichts mehr eintragen ════ */

const SDK = "https://www.gstatic.com/firebasejs/10.12.5/";
/* ?demo=1 an den Link haengen -> App laeuft nur auf diesem Geraet, ohne DB.
   Praktisch zum Ausprobieren, ohne den echten Abend-Stand anzufassen.        */
const DEMO  = /[?&]demo=1/.test(location.search);
const FB_OK = !DEMO && !!FIREBASE_CONFIG.projectId && !/HIER_/.test(JSON.stringify(FIREBASE_CONFIG));

/* Mögliche Adressen der Standard-Datenbank dieses Projekts */
function dbCandidates(){
  const inst = FIREBASE_CONFIG.projectId + '-default-rtdb';
  const list = [String(FIREBASE_CONFIG.databaseURL||'').trim()];
  DB_REGIONS.forEach(r => {
    if(r === 'us-central1') list.push(`https://${inst}.firebaseio.com`);
    list.push(`https://${inst}.${r}.firebasedatabase.app`);
  });
  return [...new Set(list.filter(u => /^https:\/\/[^ ]+$/.test(u) && !/HIER_/.test(u)))]
         .map(u => u.replace(/\/+$/,''));
}
/* Erste Adresse suchen, die tatsächlich eine Datenbank liefert.
   404 = dort gibt es keine; 401/403 = existiert, aber die Regeln sperren.     */
const DB_CACHE = 'aron-jga-dburl';
let dbNotFound = false;
async function resolveDbUrl(){
  const cands = dbCandidates();
  if(!cands.length) return '';
  let cached = null; try { cached = localStorage.getItem(DB_CACHE); } catch(e){}
  if(cached && cands.includes(cached)) return cached;
  let saw404 = 0;
  for(const u of cands){
    try{
      const r = await fetch(u + '/.json?shallow=true', { cache:'no-store' });
      if(r.status === 404){ saw404++; continue; }
      if(r.ok || r.status === 401 || r.status === 403){
        try { localStorage.setItem(DB_CACHE, u); } catch(e){}
        return u;
      }
    } catch(e){ /* Netzwerk oder CORS – nächste Adresse probieren */ }
  }
  dbNotFound = saw404 === cands.length;   // überall 404 -> Datenbank noch nicht angelegt
  return cands[0];
}

/* ───────────────────────── kleine Helfer ───────────────────────── */
const $  = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v,d) => { const n = Number(v); return Number.isFinite(n) ? n : d; };
const asArr = v => Array.isArray(v) ? v : (v && typeof v === 'object' ? Object.values(v) : []);
/* Icons liegen als <symbol> im Sprite oben in der Seite. */
const ico = (n, cls) => `<svg class="ic${cls?' '+cls:''}" aria-hidden="true"><use href="#i-${n}"></use></svg>`;
const nid = p => p + Date.now().toString(36).slice(-5) + Math.floor(Math.random()*1296).toString(36).padStart(2,'0');
const clone = o => JSON.parse(JSON.stringify(o===undefined?null:o));
const getPath = (o,p) => p.split('/').reduce((a,k)=> (a==null?undefined:a[k]), o);
const clean = v => v===undefined ? null : v;
/* Vergleichbare Form: Objekt-Keys sortiert, damit ein unveraenderter Wert auch
   dann als unveraendert erkannt wird, wenn die DB die Keys anders sortiert.  */
const stable = v => JSON.stringify((function w(x){
  if(Array.isArray(x)) return x.map(w);
  if(x && typeof x==='object') return Object.keys(x).sort().reduce((a,k)=>{ a[k]=w(x[k]); return a; },{});
  return x===undefined ? null : x;
})(v));
const isImg = v => typeof v==='string' && (v.startsWith('data:image') || /\.(jpe?g|png|webp|gif|heic)(\?|$)/i.test(v));
function setPath(root,path,val){
  const ks = path.split('/'); let o = root;
  for(let i=0;i<ks.length-1;i++){
    const k = ks[i];
    if(o[k]==null || typeof o[k]!=='object') o[k] = /^\d+$/.test(ks[i+1]) ? [] : {};
    o = o[k];
  }
  const last = ks[ks.length-1];
  if(val===null || val===undefined) { if(Array.isArray(o)) o[last]=null; else delete o[last]; }
  else o[last] = val;
}
let toastT;
function toast(msg){
  const old = $('.toast'); if(old) old.remove();
  const d = document.createElement('div'); d.className='toast'; d.textContent = msg;
  document.body.appendChild(d); clearTimeout(toastT); toastT = setTimeout(()=>d.remove(), 2600);
}
const hhmm = ts => { const d = new Date(ts||0); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const dmy  = ts => { const d = new Date(ts||0); return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'; };

/* ───────────────────────── Datenspeicher ───────────────────────── */
/* Einheitliche Schnittstelle: subscribe(cb), update(multiPathObj), newLogKey()
   Pfad-Keys sind relativ zu /aron-jga  ->  "data/..." und "log/..."        */
let store = null, LOCAL_KEY = 'aron-jga-local';

async function initStore(){
  if(FB_OK){
    const [{ initializeApp }, dbm, url] = await Promise.all([
      import(SDK+'firebase-app.js'), import(SDK+'firebase-database.js'), resolveDbUrl()
    ]);
    const { getDatabase, ref, onValue, update, push } = dbm;
    if(!url) throw new Error('Keine databaseURL – Realtime Database im Firebase-Projekt anlegen.');
    if(dbNotFound) throw new Error('Im Projekt "'+FIREBASE_CONFIG.projectId+'" gibt es noch keine Realtime Database. In der Firebase Console anlegen (Build → Realtime Database → Datenbank erstellen).');
    const db = getDatabase(initializeApp(FIREBASE_CONFIG), url);
    const rootRef = ref(db, ROOT);
    store = {
      mode:'firebase', url,
      newLogKey: () => push(ref(db, ROOT+'/log')).key,
      update: o => update(rootRef, o),
      subscribe: cb => onValue(rootRef, s => { dbError = null; cb(s.val()||{}); }, err => {
        dbError = /permission|denied/i.test(err.message)
          ? 'Die DB-Regeln blockieren den Zugriff. In der Firebase Console → Realtime Database → Regeln auf ".read": true und ".write": true setzen und veröffentlichen.'
          : err.message;
        setConn('Fehler','bad'); render();
      })
    };
  } else {
    let n = 0, subs = [];
    const read  = () => { try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || {}; } catch(e){ return {}; } };
    const write = o => { localStorage.setItem(LOCAL_KEY, JSON.stringify(o)); subs.forEach(cb => cb(clone(o))); };
    store = {
      mode:'local',
      newLogKey: () => '-L' + Date.now().toString(36) + (n++).toString(36).padStart(3,'0'),
      update: o => { const r = read(); for(const [p,v] of Object.entries(o)) setPath(r,p,v); write(r); return Promise.resolve(); },
      subscribe: cb => { subs.push(cb); cb(read()); addEventListener('storage', e => { if(e.key===LOCAL_KEY) cb(read()); }); }
    };
  }
}
function setConn(txt, kind){ const el=$('#conn'); el.textContent=txt; el.className='pill '+(kind||''); }

/* ─────────────────── Schreiben: State + Log immer zusammen ─────────────────── */
let D = {}, L = {}, dbError = null;   // D = /aron-jga/data , L = /aron-jga/log

/* changes: { "relativer/pfad/in/data": neuerWert }  – null loescht
   meta:    { type, label }                                                     */
async function tx(changes, meta){
  const upd = {}, rec = [];
  for(const [p,v] of Object.entries(changes)){
    const before = getPath(D,p);
    if(stable(before) === stable(clean(v))) continue;   /* unveraendert -> kein Write, kein Log */
    upd['data/'+p] = clean(v);
    rec.push({ path:p, from: clean(clone(before)), to: clean(clone(v)) });
  }
  if(!rec.length) return;                               /* nichts hat sich geaendert */
  const e = { ts: Date.now(), type: (meta&&meta.type) || 'edit', label: (meta&&meta.label) || 'Änderung', changes: rec };
  if(rec.length===1){ e.path = rec[0].path; e.from = rec[0].from; e.to = rec[0].to; }
  upd['log/'+store.newLogKey()] = e;
  const keys = Object.keys(L||{}).sort();
  const over = keys.length + 1 - LOG_MAX;
  for(let i=0;i<over;i++) upd['log/'+keys[i]] = null;     // aelteste rollen raus
  try { await store.update(upd); }
  catch(err){ toast('Speichern fehlgeschlagen: '+err.message); throw err; }
}
/* Einen Log-Eintrag zurueckdrehen */
async function revert(key, kind){
  const e = (L||{})[key]; if(!e) return;
  const ch = {};
  for(const c of asArr(e.changes)) ch[c.path] = c.from===undefined ? null : c.from;
  if(!Object.keys(ch).length){ toast('Nichts zurückzusetzen'); return; }
  await tx(ch, { type: kind||'revert', label: (kind==='undo'?'Undo: ':'Zurückgesetzt: ') + (e.label||'Änderung') });
  toast(kind==='undo' ? 'Letzte Änderung zurückgenommen' : 'Auf alten Wert zurückgesetzt');
}

/* ───────────────────────── Startdaten ───────────────────────── */
/* Jeder Startdaten-Eintrag hat einen festen `key`. Was daraus in der DB
   entsteht, merkt sich diesen key im Feld `seed` – daran findet der
   Abgleich seinen Eintrag spaeter wieder, auch nach einer Umbenennung.
   Ein leeres Feld heisst "nichts vorgegeben" und wird nie uebertragen.  */
const SEED_LOCATIONS = [
  { key:'kueblergo', name:'küblerGo 24/7',                       address:'Rotebühlstraße 69, 70178 Stuttgart' },
  { key:'asiate',    name:'',                                    address:'' },   /* 2. Asiate – Name/Adresse noch offen */
  { key:'moseisley', name:'Mos Eisley',                          address:'Fritz-Elsas-Straße, Stuttgart' },
  { key:'paulaner',  name:'Paulaner am alten Postplatz',         address:'Calwer Str. 4, Stuttgart' },
  { key:'wellers',   name:"WELLER'S Dinkelacker Stehausschank",  address:'Stuttgart' },
  { key:'marshall',  name:'Marshall Matt',                       address:'Eberhardstraße 6 A, 70173 Stuttgart' },
  { key:'oblomow',   name:'Oblomow',                             address:'Torstraße 20, 70173 Stuttgart' },
  { key:'suessholz', name:'Suessholz',                           address:'Wilhelmspl. 3, 70182 Stuttgart' },
  { key:'laconcha',  name:'La Concha',                           address:'Wilhelmspl. 5, 70182 Stuttgart' }
];
const SEED_DRINKS = ['Bier 0,3','Weizen','Radler','Aperol Spritz','Gin Tonic','Wodka-Lemon','Whiskey-Cola','Jägermeister Shot','Tequila','Wein','Cocktail nach Wahl des Wirts','Alkoholfrei']
  .map(n => ({ key:'d-'+n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''), name:n }));
const SEED_PARTICIPANTS = ['Dome','Dennis','Raphi','Julian','Marvin','Hermann','Lennart'].map(n => ({ key:'p-'+n.toLowerCase(), name:n }));

/* Abgleich beim Oeffnen der App: neue Eintraege und geaenderte Namen/Adressen
   wandern von allein in die DB. Angefasst wird nur, was seit dem letzten
   Abgleich unveraendert ist – wer im Admin etwas umbenannt hat, behaelt es;
   solche Faelle und Streichungen bleiben im Werkzeuge-Tab zum Anhaken.
   Auf false setzen -> gar nichts passiert ohne Knopfdruck.               */
const SEED_AUTO = true;

function seedPayload(){
  const locations = {}, participants = {};
  SEED_LOCATIONS.forEach((l,i) => {
    locations['l'+(i+1)] = { name:l.name, address:l.address, order:i+1, status:'pending', drink:null, rejected:[], deleted:false,
                             seed:l.key, seedSnap:{ name:l.name, address:l.address } };
  });
  SEED_PARTICIPANTS.forEach((s,i) => { participants['p'+(i+1)] = { name:s.name, deleted:false, seed:s.key, seedSnap:{ name:s.name } }; });
  return {
    settings:     { eventName:'Aron JGA', password:DEFAULT_PW, skipMalus:3, noRepeatDrinks:false, heroImage:'' },
    participants,
    locations,
    results:      {},
    drinks:       SEED_DRINKS.map(d => ({ name:d.name, deleted:false, seed:d.key, seedSnap:{ name:d.name } }))
  };
}
let seeded = false;
async function seedIfEmpty(){
  if(seeded || (D && D.settings)) return;
  seeded = true;
  const p = seedPayload();
  await tx({ settings:p.settings, participants:p.participants, locations:p.locations, results:p.results, drinks:p.drinks },
           { type:'seed', label:'Startdaten angelegt' });
}

/* ── Abgleich Code -> laufende DB ──────────────────────────────────────
   Vergleicht die SEED_*-Listen mit dem, was in der DB steht, und macht
   daraus eine Liste von Einzelposten. Jeder Posten ist einzeln anhakbar,
   geschrieben wird nur das Angehakte. Ergebnisse, Schlücke, Status und
   Reihenfolge fasst der Abgleich nie an – die Reihenfolge wird im
   Admin-Tab gepflegt, nicht aus dem Code gesetzt.

   Kategorien:
     add    neu anlegen (kein Gegenstueck in der DB)
     diff   Feld weicht ab und wurde hier seit dem letzten Abgleich nicht
            angefasst -> laeuft automatisch mit
     conf   Feld weicht ab, aber der Wert wurde im Admin geaendert -> bleibt,
            bis jemand den Haken setzt
     gone   Eintrag stammt aus den Startdaten, steht dort aber nicht mehr
     link   Zuordnung merken (Alt-Datensatz ohne `seed`, per Name erkannt)
     snap   nur den Merkzettel `seedSnap` nachziehen, aendert nichts Sichtbares

   `seedSnap` haelt fest, was der Abgleich zuletzt geschrieben hat. Aus dem
   Dreieck Code / seedSnap / DB faellt heraus, wer sich bewegt hat: weicht die
   DB vom Merkzettel ab, war es jemand im Admin – dann Finger weg.         */
function seedKinds(){
  return [
    { k:'participants', label:'Teilnehmer', path:'participants/', pre:'p',
      seeds:SEED_PARTICIPANTS, live:partsAll(), fields:[['name','Name']],
      make:s => ({ name:s.name, deleted:false, seed:s.key, seedSnap:{ name:s.name } }) },
    { k:'locations', label:'Bar', path:'locations/', pre:'l',
      seeds:SEED_LOCATIONS, live:locsAll(), fields:[['name','Name'],['address','Adresse']],
      make:(s,ord) => ({ name:s.name, address:s.address||'', order:ord, status:'pending', drink:null, rejected:[], deleted:false,
                         seed:s.key, seedSnap:{ name:s.name, address:s.address||'' } }) },
    { k:'drinks', label:'Getränk', path:'drinks/', pre:null,
      seeds:SEED_DRINKS, live:drinksAll(), fields:[['name','Name']],
      make:s => ({ name:s.name, deleted:false, seed:s.key, seedSnap:{ name:s.name } }) }
  ];
}
function seedPlan(){
  const norm = v => String(v==null?'':v).trim().toLowerCase();
  const items = [], taken = new Set();
  const uniq = pre => { let id; do { id = nid(pre); } while(taken.has(id)); taken.add(id); return id; };
  let ord = Math.max(0, ...locsAll().map(l=>num(l.order,0))), ix = nextDrinkIx();

  seedKinds().forEach(K => {
    const byKey = {}, used = new Set();
    K.live.forEach(e => { if(e.seed) byKey[e.seed] = e; });
    K.seeds.forEach((s,i) => {
      let e = byKey[s.key], link = false;
      if(!e && norm(s.name)){                       /* noch nie abgeglichen -> ueber den Namen */
        e = K.live.find(x => !x.seed && !used.has(x.id) && norm(x.name)===norm(s.name));
        link = !!e;
      }
      if(!e && !norm(s.name) && K.k==='locations'){ /* Platzhalter ohne Namen: ueber die Position */
        const c = K.live[i]; if(c && !c.seed && !used.has(c.id)){ e = c; link = true; }
      }
      if(!e){
        const id = K.k==='drinks' ? String(ix++) : uniq(K.pre);
        items.push({ id:K.k+'|'+s.key+'|neu', cat:'add', kind:K.label, label:s.name||'(ohne Name)',
                     paths:{ [K.path+id]: K.make(s, ++ord) } });
        return;
      }
      used.add(e.id);
      if(link) items.push({ id:K.k+'|'+s.key+'|link', cat:'link', kind:K.label, label:e.name||'(ohne Name)',
                            paths:{ [K.path+e.id+'/seed']: s.key } });
      const snap = (e.seedSnap && typeof e.seedSnap==='object') ? e.seedSnap : null;
      K.fields.forEach(([f,fl]) => {
        const code = String(s[f] ?? ''), live = String(e[f] ?? '');
        if(!code) return;                           /* leer im Code = keine Vorgabe */
        const seen = snap && snap[f]!==undefined ? String(snap[f]) : null;
        const stamp = e.seed ? {} : { [K.path+e.id+'/seed']: s.key };
        if(code === live){                          /* deckungsgleich – nur den Merkzettel pflegen */
          if(seen !== code) items.push({ id:K.k+'|'+s.key+'|'+f+'|snap', cat:'snap', kind:K.label,
            label:(e.name||'(ohne Name)')+' · '+fl, paths:{ [K.path+e.id+'/seedSnap/'+f]: code, ...stamp } });
          return;
        }
        const touched = seen === null || seen !== live;   /* im Admin angefasst? */
        items.push({ id:K.k+'|'+s.key+'|'+f, cat:touched?'conf':'diff', kind:K.label,
                     label:(e.name||s.name||'(ohne Name)')+' · '+fl, from:live, to:code,
                     paths:{ [K.path+e.id+'/'+f]: code, [K.path+e.id+'/seedSnap/'+f]: code, ...stamp } });
      });
    });
    const keys = new Set(K.seeds.map(s=>s.key));
    K.live.forEach(e => {
      if(!e.seed || keys.has(e.seed) || e.deleted) return;
      items.push({ id:K.k+'|'+e.seed+'|weg', cat:'gone', kind:K.label, label:e.name||'(ohne Name)',
                   paths:{ [K.path+e.id+'/deleted']:true, [K.path+e.id+'/deletedAt']:now() } });
    });
  });
  return items;
}
const SEED_CAT = { add:true, diff:true, conf:false, gone:false, link:true, snap:true };  /* Vorauswahl der Haken */
const seedPicked = it => (ui.seedSel && ui.seedSel[it.id] !== undefined) ? !!ui.seedSel[it.id] : SEED_CAT[it.cat];
const SEED_SELF = ['add','diff','link','snap'];        /* was ohne Nachfrage laufen darf */

/* Laeuft bei jedem Datenstand einmal durch. Schlaegt der Schreibversuch fehl
   (z.B. DB-Regeln), wird es nicht endlos wiederholt.                       */
let seedBusy = false, seedOff = false;
async function seedAutoSync(){
  if(!SEED_AUTO || seedBusy || seedOff || !D || !D.settings) return;
  const pick = seedPlan().filter(i => SEED_SELF.includes(i.cat));
  if(!pick.length) return;
  const ch = {}; pick.forEach(i => Object.assign(ch, i.paths));
  const neu = pick.filter(i=>i.cat==='add').length, ged = pick.filter(i=>i.cat==='diff').length;
  const summe = [ neu?neu+'x neu':'', ged?ged+'x geändert':'' ].filter(Boolean).join(', ');
  seedBusy = true;
  try {
    await tx(ch, { type:'seed-auto', label:'Startdaten übernommen'+(summe?': '+summe:' (Zuordnung)') });
    if(summe && admin) toast('Startdaten übernommen: '+summe);
  } catch(err){ seedOff = true; }
  finally { seedBusy = false; }
}

/* ───────────────────────── Abgeleitete Daten ───────────────────────── */
const S = () => D.settings || {};
const partsAll = () => Object.entries(D.participants||{}).filter(([,p])=>p&&typeof p==='object').map(([id,p])=>({id,...p}));
const parts    = () => partsAll().filter(p=>!p.deleted).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'de'));
const locsAll  = () => Object.entries(D.locations||{}).filter(([,l])=>l&&typeof l==='object').map(([id,l])=>({id,...l}))
                       .sort((a,b)=> num(a.order,999)-num(b.order,999) || a.id.localeCompare(b.id));
const locs     = () => locsAll().filter(l=>!l.deleted);
/* Getränke liegen als Array – die DB kann daraus aber ein Objekt mit
   Zahlen-Keys machen. Deshalb immer mit den echten Keys arbeiten.      */
const drinksAll= () => (Array.isArray(D.drinks) ? D.drinks.map((d,i)=>[String(i),d]) : Object.entries(D.drinks||{}))
                       .filter(([,d]) => d && typeof d==='object')
                       .map(([k,d]) => ({ ...d, i:k, id:k, name:d.name||'', deleted:!!d.deleted }))
                       .sort((a,b) => num(a.i,0)-num(b.i,0));
const nextDrinkIx = () => Math.max(-1, ...drinksAll().map(d=>num(d.i,-1))) + 1;
const drinks   = () => drinksAll().filter(d=>d.name && !d.deleted);
const rkey     = (lid,pid) => lid+'_'+pid;
const rawRes   = (lid,pid) => (D.results||{})[rkey(lid,pid)];
const skipMalus= () => num(S().skipMalus, 3);

/* Schlücke einer Bar: {pid: {sips, skipped}} – "ausgesetzt" = Ø der Bar + skipMalus */
function barSips(lid){
  const out = {}, plain = [];
  parts().forEach(p => {
    const r = rawRes(lid,p.id);
    if(!r || typeof r!=='object' || r.deleted) return;
    if(r.skipped){ out[p.id] = { skipped:true, sips:0 }; }
    else if(Number.isFinite(Number(r.sips))){ const v = Number(r.sips); out[p.id] = { skipped:false, sips:v }; plain.push(v); }
  });
  const avg = plain.length ? plain.reduce((a,b)=>a+b,0)/plain.length : 0;
  Object.values(out).forEach(v => { if(v.skipped) v.sips = Math.round(avg) + skipMalus(); });
  out._avg = avg; out._n = plain.length;
  return out;
}
function ranking(){
  const rows = parts().map(p => ({ ...p, total:0, n:0 }));
  const byId = Object.fromEntries(rows.map(r=>[r.id,r]));
  locs().forEach(l => {
    const b = barSips(l.id);
    Object.entries(b).forEach(([pid,v]) => { if(pid.startsWith('_')) return; if(byId[pid]){ byId[pid].total += v.sips; byId[pid].n++; } });
  });
  rows.forEach(r => r.avg = r.n ? r.total/r.n : 0);
  rows.sort((a,b) => a.total-b.total || a.avg-b.avg || String(a.name||'').localeCompare(String(b.name||''),'de'));
  return rows;
}
function barWinner(lid){
  const b = barSips(lid), names = Object.fromEntries(parts().map(p=>[p.id,p.name]));
  let best = null;
  Object.entries(b).forEach(([pid,v]) => { if(pid.startsWith('_')) return; if(!best || v.sips < best.sips) best = { pid, sips:v.sips, name:names[pid] }; });
  return best;
}
function activeLoc(){ const ls = locs(); return ls.find(l=>l.status==='active') || ls.find(l=>l.status!=='done') || ls[0] || null; }
function usedDrinks(exceptLid){ return locs().filter(l=>l.id!==exceptLid && l.drink).map(l=>l.drink); }
function availableDrinks(lid){
  const loc = (D.locations||{})[lid] || {};
  const rej = asArr(loc.rejected).map(String);
  const used = S().noRepeatDrinks ? usedDrinks(lid) : [];
  return drinks().filter(d => !rej.includes(d.name) && !used.includes(d.name));
}

function heroSrc(){

function render(){

  const sel = fk && act.setSelectionRange && act.type!=='number' ? [act.selectionStart, act.selectionEnd] : null;

    if(el){ el.focus({preventScroll:true}); if(sel && el.setSelectionRange){ try{ el.setSelectionRange(sel[0],sel[1]); }catch(e){} } window.scrollTo(0,scroll); }
  }

function shrinkImage(file, cb){
  const fr = new FileReader();
  fr.onload = () => { const im = new Image();
    im.onload = () => {
      const max = 900, s = Math.min(1, max/Math.max(im.width,im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width*s); c.height = Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg', 0.74));
    };
    im.onerror = () => toast('Bild konnte nicht gelesen werden');
    im.src = fr.result; };
  fr.onerror = () => toast('Datei konnte nicht gelesen werden');
  fr.readAsDataURL(file);
}

/* ───────────────────────── Glücksrad ───────────────────────── */
/* Farbe der Rad-Segmente: Der Farbton kommt aus der Position, die Helligkeit
   aus dem gewünschten Kontrast zur Beschriftung. Gelb wirkt viel heller als
   Blau – mit fester Helligkeit wäre die weiße Schrift mal knallig, mal
   unlesbar. Deshalb wird pro Farbton die hellste Stufe gesucht, die den
   Zielkontrast noch hält, per Intervallhalbierung. Zwei Zielwerte im Wechsel
   halten benachbarte Felder auseinander.                                     */
const WHEEL_TXT = '#fdf7f2';
const relLum = (r,g,b) => { const f = v => { v/=255; return v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4); };
  return .2126*f(r) + .7152*f(g) + .0722*f(b); };
const hsl2rgb = (h,s,l) => { s/=100; l/=100;
  const k = n => (n + h/30) % 12, a = s*Math.min(l,1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, 9-k(n), 1));
  return [f(0)*255, f(8)*255, f(4)*255]; };
const LUM_TXT = relLum(253,247,242);
const segCache = {};
function segLight(hue, sat, target){
  const key = hue+'|'+sat+'|'+target;
  if(segCache[key] !== undefined) return segCache[key];
  let lo = 6, hi = 62;                       /* lo hält den Kontrast, hi ist schon zu hell */
  for(let i=0;i<16;i++){
    const mid = (lo+hi)/2;
    const c = (LUM_TXT + .05) / (relLum(...hsl2rgb(hue,sat,mid)) + .05);
    if(c > target) lo = mid; else hi = mid;
  }
  return segCache[key] = Math.round(lo*10)/10;
}

function drawWheel(){
  const c = document.getElementById('wheel'); if(!c) return;
  const size = Math.max(220, Math.min(360, window.innerWidth - 46));
  const dpr = window.devicePixelRatio || 1;
  c.style.width = size+'px'; c.style.height = size+'px';
  c.width = Math.round(size*dpr); c.height = Math.round(size*dpr);
  const x = c.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0);
  const av = availableDrinks(ui.wheelLoc), R = size/2;
  x.clearRect(0,0,size,size);
  x.save(); x.translate(R,R);
  if(!av.length){
    x.beginPath(); x.arc(0,0,R-8,0,Math.PI*2); x.fillStyle='#151822'; x.fill();
    x.strokeStyle='#272c38'; x.lineWidth=3; x.stroke(); x.restore(); return;
  }
  const n = av.length, seg = Math.PI*2/n;
  const fs = Math.max(9, Math.min(14, Math.round(150/n) + 3));
  for(let i=0;i<n;i++){
    const a0 = ui.angle + i*seg;
    x.beginPath(); x.moveTo(0,0); x.arc(0,0,R-6,a0,a0+seg); x.closePath();
    /* Jede Scheibe eine eigene Farbe, einmal rund um den Farbkreis. */
    const hue = Math.round((i*360/n + 22) % 360), sat = i%2 ? 64 : 72;
    x.fillStyle = `hsl(${hue} ${sat}% ${segLight(hue, sat, i%2 ? 5 : 8)}%)`; x.fill();
    x.strokeStyle = 'rgba(8,9,14,.55)'; x.lineWidth = 1.5; x.stroke();
    const mid = a0 + seg/2;
    x.save(); x.rotate(mid);
    x.fillStyle = '#fdf7f2'; x.textBaseline = 'middle';
    x.shadowColor = 'rgba(0,0,0,.5)'; x.shadowBlur = 3; x.shadowOffsetY = 1;
    let t = av[i].name, f = fs, maxW = R - 36;
    const F = () => x.font = `650 ${f}px Archivo,-apple-system,system-ui,sans-serif`;
    F(); while(x.measureText(t).width > maxW && f > 8){ f--; F(); }
    if(x.measureText(t).width > maxW){ while(t.length > 4 && x.measureText(t+'…').width > maxW) t = t.slice(0,-1); t += '…'; }
    if(Math.cos(mid) < 0){ x.rotate(Math.PI); x.textAlign = 'left'; x.fillText(t, -(R-18), 0); }
    else { x.textAlign = 'right'; x.fillText(t, R-18, 0); }
    x.shadowBlur = 0; x.shadowOffsetY = 0;
    x.restore();
  }
  x.beginPath(); x.arc(0,0,R-6,0,Math.PI*2); x.strokeStyle='rgba(8,9,14,.9)'; x.lineWidth=9; x.stroke();
  x.beginPath(); x.arc(0,0,R-6,0,Math.PI*2); x.strokeStyle='#ff8a2b'; x.lineWidth=3; x.stroke();
  x.beginPath(); x.arc(0,0,22,0,Math.PI*2); x.fillStyle='#0b0c11'; x.fill();
  x.strokeStyle='#ff8a2b'; x.lineWidth=2.5; x.stroke();
  x.beginPath(); x.arc(0,0,5,0,Math.PI*2); x.fillStyle='#ff8a2b'; x.fill();
  x.restore();
}
function spin(){
  const av = availableDrinks(ui.wheelLoc);
  if(!av.length){ toast('Keine Getränke übrig'); return; }
  const t = Math.floor(Math.random()*av.length), seg = Math.PI*2/av.length;
  let end = -Math.PI/2 - t*seg - seg/2;
  while(end < ui.angle + Math.PI*2*4) end += Math.PI*2;
  const from = ui.angle, dur = 3000, t0 = performance.now();
  ui.spinning = true; ui.result = null;
  const rEl = document.querySelector('.result'); if(rEl) rEl.textContent = '';
  document.querySelectorAll('[data-a="spin"],[data-a="accept"],[data-a="reject"]').forEach(b => b.disabled = true);
  requestAnimationFrame(function step(ts){
    const p = Math.min(1, (ts-t0)/dur), e = 1 - Math.pow(1-p, 3);
    ui.angle = from + (end-from)*e; drawWheel();
    if(p < 1) requestAnimationFrame(step);
    else { ui.spinning = false; ui.result = av[t].name; render(); try{ navigator.vibrate && navigator.vibrate(70); }catch(err){} }
  });
}

/* Aktionen, die schreiben -> nur im Admin-Modus erlaubt. Alles andere
   (Tab-Wechsel, Rad drehen, Login, Backup kopieren) darf jeder.        */
const CLICK_WRITE = ['padd','pdel','ladd','ldel','lstat','ldrinkclr','lup','ldown','rejfree','rejclr',
  'sm','sp','sdel','dadd','ddel','accept','reject','imgclr','logrev','restore','undo','bpaste','jsave','seedapply','reset','wipelog'];
const CHANGE_WRITE = ['manual','pname','lname','laddr','ldrink','ssk','sv','dname',
  'setname','setpw','setmalus','setnorep','setimg','imgfile'];

/* ───────────────────────── Events ───────────────────────── */
document.addEventListener('toggle', e => {
  const d = e.target.closest ? e.target.closest('details.sec') : null;
  if(d && d.dataset.sec) ui.open[d.dataset.sec] = d.open;
}, true);

$('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if(b) go(b.dataset.tab); });

document.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  const m = { newpart:'padd', newloc:'ladd', newdrink:'dadd' }[e.target.id];
  if(m){ e.preventDefault(); const b = document.querySelector('[data-a="'+m+'"]'); if(b) b.click(); }
});
document.addEventListener('input', e => { if(e.target.dataset && e.target.dataset.a==='jinput') ui.jsonDraft = e.target.value; });

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a, lid = el.dataset.l, pid = el.dataset.p, i = el.dataset.i;
  if(CLICK_WRITE.includes(a) && !admin){ toast('Nur im Admin-Modus'); return; }
  try{
  switch(a){
    case 'tab': go(el.dataset.t); break;
    case 'maps': window.open(maps(el.dataset.adr), '_blank', 'noopener'); break;
    case 'editbar': ui.sipsBar = lid; ui.open.sips = true; ui.wheelLoc = lid; go('admin'); break;
    case 'login': {
      const inp = document.querySelector('[data-a="pw"]'); const pw = inp ? inp.value : '';
      if(pw && pw === String(S().password ?? DEFAULT_PW)){ localStorage.setItem(ADMIN_KEY, pw); ui.pwWrong = false; checkAdmin(); toast('Admin-Modus aktiv'); }
      else ui.pwWrong = true;
      render(); break; }
    case 'logout': localStorage.removeItem(ADMIN_KEY); admin = false; render(); break;

    /* Teilnehmer */
    case 'padd': { const inp = $('#newpart'), nm = (inp.value||'').trim(); if(!nm) return;
      inp.value=''; await tx({ ['participants/'+nid('p')]: { name:nm, deleted:false } }, { type:'part-add', label:'Teilnehmer angelegt: '+nm }); break; }
    case 'pdel': if(!confirm('Wirklich löschen? Landet im Papierkorb.')) return;
      await tx({ ['participants/'+pid+'/deleted']:true, ['participants/'+pid+'/deletedAt']:now() }, { type:'part-del', label:'Teilnehmer gelöscht: '+pName(pid) }); break;

    /* Bars */
    case 'ladd': { const inp = $('#newloc'), nm = (inp.value||'').trim();
      const mx = Math.max(0, ...locsAll().map(l=>num(l.order,0))); inp.value='';
      await tx({ ['locations/'+nid('l')]: { name:nm, address:'', order:mx+1, status:'pending', drink:null, rejected:[], deleted:false } },
               { type:'loc-add', label:'Bar angelegt: '+(nm||'(ohne Name)') }); break; }
    case 'ldel': if(!confirm('Wirklich löschen? Landet im Papierkorb.')) return;
      await tx({ ['locations/'+lid+'/deleted']:true, ['locations/'+lid+'/deletedAt']:now() }, { type:'loc-del', label:'Bar gelöscht: '+lName(lid) }); break;
    case 'lstat': await tx({ ['locations/'+lid+'/status']: el.dataset.s }, { type:'status', label:'Status '+lName(lid) }); break;
    case 'ldrinkclr': if(!confirm('Getränk verwerfen? Steht danach wieder im Verlauf.')) return;
      await tx({ ['locations/'+lid+'/drink']: null }, { type:'drink', label:'Getränk verworfen @ '+lName(lid) }); break;
    case 'lup': case 'ldown': {
      const ls = locs(), ix = ls.findIndex(l=>l.id===lid), jx = a==='lup' ? ix-1 : ix+1;
      if(ix<0 || jx<0 || jx>=ls.length) return;
      await tx({ ['locations/'+ls[ix].id+'/order']: num(ls[jx].order,jx+1), ['locations/'+ls[jx].id+'/order']: num(ls[ix].order,ix+1) },
               { type:'order', label:'Reihenfolge: '+(ls[ix].name||'?')+' ↔ '+(ls[jx].name||'?') }); break; }
    case 'rejfree': { const arr = asArr(((D.locations||{})[lid]||{}).rejected).slice(); const gone = arr[Number(i)];
      arr.splice(Number(i),1);
      await tx({ ['locations/'+lid+'/rejected']: arr }, { type:'reject', label:'Freigegeben: '+gone+' @ '+lName(lid) }); break; }
    case 'rejclr': await tx({ ['locations/'+lid+'/rejected']: [] }, { type:'reject', label:'Alle Ausschlüsse frei @ '+lName(lid) }); break;

    /* Schlücke */
    case 'sm': case 'sp': {
      const b = barSips(lid), cur = (b[pid]||{}).sips;
      const base = Number.isFinite(cur) ? cur : (a==='sp' ? 0 : 1);
      await setSips(lid, pid, a==='sp' ? base+1 : base-1); break; }
    case 'sdel': { if(!confirm('Wirklich löschen? Landet im Papierkorb.')) return;
      const k = rkey(lid,pid);
      await tx({ ['results/'+k+'/deleted']:true, ['results/'+k+'/deletedAt']:now() }, { type:'sips-del', label:'Schluck-Wert gelöscht: '+pName(pid)+' @ '+lName(lid) }); break; }

    /* Getränke */
    case 'dadd': { const inp = $('#newdrink'), nm = (inp.value||'').trim(); if(!nm) return;
      inp.value='';
      await tx({ ['drinks/'+nextDrinkIx()]: { name:nm, deleted:false } }, { type:'drink-add', label:'Getränk angelegt: '+nm }); break; }
    case 'ddel': if(!confirm('Wirklich löschen? Landet im Papierkorb.')) return;
      await tx({ ['drinks/'+i+'/deleted']:true }, { type:'drink-del', label:'Getränk gelöscht: '+((drinksAll().find(d=>d.i===String(i))||{}).name||'?') }); break;

    /* Rad */
    case 'spin': spin(); break;
    case 'accept': { if(!ui.result) return;
      await tx({ ['locations/'+ui.wheelLoc+'/drink']: ui.result, ['locations/'+ui.wheelLoc+'/status']:'active' },
               { type:'drink', label:'Getränk gesetzt @ '+lName(ui.wheelLoc)+': '+ui.result });
      ui.result = null; toast('Getränk übernommen'); go('tour'); break; }
    case 'reject': { if(!ui.result) return;
      const arr = asArr(((D.locations||{})[ui.wheelLoc]||{}).rejected).slice(); arr.push(ui.result);
      const gone = ui.result; ui.result = null;
      await tx({ ['locations/'+ui.wheelLoc+'/rejected']: arr }, { type:'reject', label:"Gibt's hier nicht: "+gone+' @ '+lName(ui.wheelLoc) });
      setTimeout(spin, 260); break; }

    /* Bild */
    case 'imgclr': if(!confirm('Bild entfernen? Der alte Wert bleibt im Verlauf.')) return;
      await tx({ 'settings/heroImage': '' }, { type:'image', label:'Bild entfernt' }); break;

    /* Verlauf / Papierkorb / Werkzeuge */
    case 'logrev': if(!confirm('Diesen Eintrag auf den alten Wert zurücksetzen?')) return; await revert(el.dataset.key,'revert'); break;
    case 'logmore': ui.logMax += 120; render(); break;
    case 'restore': { const t = (ui._trash||[])[Number(i)]; if(!t) return;
      await tx(t.paths, { type:'restore', label:'Wiederhergestellt – '+t.label }); toast('Wiederhergestellt'); break; }
    case 'undo': { const k = Object.keys(L||{}).sort().pop(); if(!k) return;
      if(!confirm('Letzte Änderung zurücknehmen?\n\n'+(L[k].label||''))) return; await revert(k,'undo'); break; }
    case 'bcopy': { const txt = JSON.stringify({ exported:now(), data:D, log:L }, null, 2);
      try { await navigator.clipboard.writeText(txt); toast('Backup in der Zwischenablage'); }
      catch(err){ const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove(); toast('Backup kopiert'); } break; }
    case 'bpaste': { let txt = '';
      try { txt = await navigator.clipboard.readText(); } catch(err){}
      if(!txt) txt = prompt('Backup-JSON hier einfügen:') || '';
      if(!txt.trim()) return;
      if(!confirm('Backup einspielen? Aktueller Stand wird ersetzt (bleibt im Verlauf).')) return;
      await applyState(JSON.parse(txt)); toast('Backup eingespielt'); break; }
    case 'jsave': { const ta = document.querySelector('[data-a="jinput"]');
      const parsed = JSON.parse(ta.value);
      if(!parsed || typeof parsed!=='object' || Array.isArray(parsed)) throw new Error('JSON muss ein Objekt sein.');
      if(!confirm('State ersetzen? Alter Stand bleibt im Verlauf.')) return;
      await applyState(parsed); ui.jsonDraft = null; toast('JSON gespeichert'); render(); break; }
    case 'jreset': ui.jsonDraft = null; render(); break;
    case 'seedsync': ui.seedOpen = !ui.seedOpen; ui.seedSel = {}; ui.open.tools = true; render(); break;
    case 'seedclose': ui.seedOpen = false; ui.seedSel = {}; render(); break;
    case 'seedapply': {
      const pick = seedPlan().filter(seedPicked);
      if(!pick.length){ toast('Nichts angehakt'); return; }
      const cnt = c => pick.filter(i=>i.cat===c).length;
      const summe = [ cnt('add')?cnt('add')+'x neu':'', cnt('diff')?cnt('diff')+'x geändert':'',
                      cnt('gone')?cnt('gone')+'x in den Papierkorb':'', cnt('link')?cnt('link')+'x verknüpft':'' ]
                    .filter(Boolean).join(', ');
      if(!confirm('Startdaten übernehmen?\n\n'+summe+'\n\nSchlücke und Ergebnisse bleiben unangetastet.')) return;
      const ch = {}; pick.forEach(i => Object.assign(ch, i.paths));
      await tx(ch, { type:'seed-sync', label:'Startdaten abgeglichen: '+summe });
      ui.seedOpen = false; ui.seedSel = {}; toast('Übernommen: '+summe); break; }
    case 'reset': {
      if(!confirm('ALLES zurücksetzen?\n\nTeilnehmer, Bars, Ergebnisse und Getränke werden geleert. Der Verlauf bleibt.')) return;
      if(!confirm('Sicher? Zweite Bestätigung.\nDer Abend bleibt über den Verlauf nachlesbar und rekonstruierbar.')) return;
      await tx({ participants:null, locations:null, results:null, drinks:null }, { type:'reset', label:'Alles zurückgesetzt' });
      toast('Zurückgesetzt – Verlauf ist erhalten'); break; }
    case 'wipelog': {
      if(!confirm('Verlauf ENDGÜLTIG löschen?\n\nDanach ist nichts mehr rekonstruierbar.')) return;
      if(!confirm('Wirklich endgültig? Das kann niemand zurückholen.')) return;
      await store.update({ log:null }); toast('Verlauf gelöscht'); break; }
  }
  } catch(err){ toast('Fehler: '+err.message); }
});

document.addEventListener('change', async e => {
  const el = e.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a, lid = el.dataset.l, pid = el.dataset.p, i = el.dataset.i, val = el.value;
  if(a==='wloc' || a==='sbar' || a==='seedpick'){ /* nur Ansicht, auch ohne Admin */ }
  else if(!CHANGE_WRITE.includes(a)) return;              /* z.B. Passwortfeld: nichts zu tun */
  else if(!admin){ toast('Nur im Admin-Modus'); return; }
  try{
  switch(a){
    case 'seedpick': ui.seedSel[el.dataset.k] = el.checked; break;
    case 'wloc':  ui.wheelLoc = val; ui.result = null; render(); break;
    case 'sbar':  ui.sipsBar = val; render(); break;
    case 'manual': if(!val) return; if(!admin){ toast('Nur im Admin-Modus'); return; }
      await tx({ ['locations/'+ui.wheelLoc+'/drink']: val, ['locations/'+ui.wheelLoc+'/status']:'active' },
               { type:'drink', label:'Getränk manuell @ '+lName(ui.wheelLoc)+': '+val });
      ui.result = null; toast('Getränk gesetzt'); go('tour'); break;
    case 'pname': await tx({ ['participants/'+pid+'/name']: val.trim() }, { type:'part-name', label:'Teilnehmer umbenannt' }); break;
    case 'lname': await tx({ ['locations/'+lid+'/name']: val.trim() }, { type:'loc-name', label:'Bar umbenannt' }); break;
    case 'laddr': await tx({ ['locations/'+lid+'/address']: val.trim() }, { type:'loc-addr', label:'Adresse '+lName(lid) }); break;
    case 'ldrink': if(!val) return;
      await tx({ ['locations/'+lid+'/drink']: val }, { type:'drink', label:'Getränk manuell @ '+lName(lid)+': '+val }); break;
    case 'ssk': await setSkip(lid, pid, el.checked); break;
    case 'sv':  if(val==='' ){ render(); return; } await setSips(lid, pid, val); break;
    case 'dname': await tx({ ['drinks/'+i+'/name']: val.trim() }, { type:'drink-name', label:'Getränk umbenannt' }); break;
    case 'setname': await tx({ 'settings/eventName': val.trim() }, { type:'settings', label:'Event-Name' }); break;
    case 'setpw': { const pw = val.trim(); if(!pw){ toast('Passwort darf nicht leer sein'); render(); return; }
      /* Erst das Geraet umstellen, dann schreiben: der onValue-Callback kommt
         sonst zurueck, bevor das neue Passwort hier liegt – und wirft den
         Admin fuer einen Render aus dem Admin-Tab.                          */
      const prev = localStorage.getItem(ADMIN_KEY);
      try {
        localStorage.setItem(ADMIN_KEY, pw);
        await tx({ 'settings/password': pw }, { type:'settings', label:'Passwort geändert' });
      } catch(err){ if(prev===null) localStorage.removeItem(ADMIN_KEY); else localStorage.setItem(ADMIN_KEY, prev); throw err; }
      checkAdmin(); render();
      toast('Passwort geändert – alter Zugang gilt nicht mehr'); break; }
    case 'setmalus': await tx({ 'settings/skipMalus': Math.max(0, Math.round(num(val,3))) }, { type:'settings', label:'Malus für „ausgesetzt"' }); break;
    case 'setnorep': await tx({ 'settings/noRepeatDrinks': el.checked }, { type:'settings', label:'Getränke nicht wiederholen' }); break;
    case 'setimg': await tx({ 'settings/heroImage': val.trim() }, { type:'image', label:'Bild-URL' }); break;
    case 'imgfile': { const f = el.files && el.files[0]; if(!f) return; toast('Bild wird verarbeitet…');
      shrinkImage(f, async d => { try{ await tx({ 'settings/heroImage': d }, { type:'image', label:'Foto hochgeladen' }); toast('Bild gespeichert'); }
                                  catch(err){ toast('Fehler: '+err.message); } }); break; }
  }
  } catch(err){ toast('Fehler: '+err.message); render(); }
});

    D = (snap && snap.data) || {};

    checkAdmin();
    seedIfEmpty();
    seedAutoSync();
    render();
  });
})();
